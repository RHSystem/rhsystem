<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RH System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA;--surface:#FBFBF8;--ink:#1B2333;--muted:#5E6676;--line:#D5D9D1;--soft:#E3E7DF;
  --accent:#F2B01E;--onaccent:#1B2333;--pos:#2B7A4B;--neg:#B63F2E;--info:#2A5A9C;--warn:#8F6200;
  --side:#1B2333;--sideink:#E8EBF0;--sidemuted:#98A1B3;
  --f-head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141922;--surface:#1C2330;--ink:#E8ECF2;--muted:#9AA3B3;--line:#2D3647;--soft:#252D3C;
    --pos:#5DC088;--neg:#E8826F;--info:#82ADE3;--warn:#E5B24A;--side:#0F131A;
  }
}
:root[data-theme="dark"]{
  --bg:#141922;--surface:#1C2330;--ink:#E8ECF2;--muted:#9AA3B3;--line:#2D3647;--soft:#252D3C;
  --pos:#5DC088;--neg:#E8826F;--info:#82ADE3;--warn:#E5B24A;--side:#0F131A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:.2px;line-height:1.1}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* layout */
.side{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.brand{font-family:var(--f-head);font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px;text-decoration:none}
.brand i{width:14px;height:14px;background:var(--accent);display:inline-block;border-radius:2px;transform:rotate(45deg)}
.main{padding:8px 16px 104px}
#view{max-width:1040px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:11.5px;color:var(--muted);text-decoration:none;border-top:3px solid transparent}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
@media (min-width:860px){
  .mtop,.tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);color:var(--sideink);padding:24px 14px}
  .side .brand{font-size:30px;padding:0 10px 22px;color:#fff}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side a.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;text-decoration:none;color:var(--sidemuted);font-weight:500}
  .side a.nl:hover{background:rgba(255,255,255,.06);color:#fff}
  .side a.nl[aria-current="page"]{background:rgba(242,176,30,.14);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .side .grow{flex:1}
  .main{margin-left:232px;padding:30px 40px 60px}
}

/* page head with measuring tape */
.pagehead{margin:14px 0 18px}
.pagehead .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pagehead h1{font-size:38px}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tape{height:12px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--onaccent) 0 1.5px,transparent 1.5px 40px) left bottom/100% 12px no-repeat,
  repeating-linear-gradient(90deg,var(--onaccent) 0 1px,transparent 1px 8px) left bottom/100% 6px no-repeat,
  var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--neg)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:14px}
.btn.block{width:100%}
.icon-btn{background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow-x:auto;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
select,input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:42px}
textarea{min-height:84px;resize:vertical}
.filters select{width:auto;min-width:130px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:500}

/* data surfaces (ledger rows, not cards) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel+.panel,.section{margin-top:18px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:8px}
.ph h2{font-size:23px}
.list>.item,.list>a.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.item:hover{background:var(--soft)}
.item .main2{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--pos)}.chip.bad{color:var(--neg)}.chip.info{color:var(--info)}.chip.warn{color:var(--warn)}.chip.mute{color:var(--muted)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--neg)}

/* metrics strip */
.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.metrics>div{padding:14px 16px;border-top:1px solid var(--line)}
.metrics>div:nth-child(-n+2){border-top:0}
.metrics>div:nth-child(even){border-left:1px solid var(--line)}
.metrics .k{font-size:13.5px;color:var(--muted)}
.metrics .v{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.15;margin-top:2px}
@media (min-width:760px){
  .metrics{grid-template-columns:repeat(4,1fr)}
  .metrics>div{border-top:0!important;border-left:1px solid var(--line)!important}
  .metrics>div:first-child{border-left:0!important}
}
.cols{display:grid;gap:18px}
@media (min-width:900px){.cols.two{grid-template-columns:1.2fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr);align-items:start}}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 16px 0}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;max-width:26px;border-radius:2px 2px 0 0;min-height:2px}
.chart .bi{background:var(--pos)}.chart .bo{background:var(--accent)}
.chart small{color:var(--muted);font-size:12px}
.legend{display:flex;gap:16px;padding:8px 16px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.cat{padding:9px 16px;border-top:1px solid var(--line)}
.cat .r{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}

/* kanban */
.kan h3{font-size:20px;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.kan h3 span{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:15px}
.task{padding:12px 16px;border-top:1px solid var(--line)}
.kan h3+.task{border-top:0}
.task .t{font-weight:600}
.task .s{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.task .late{color:var(--neg);font-weight:600}
.task .bt{display:flex;gap:6px;flex-wrap:wrap}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:94%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sheet-h h2{font-size:26px}
.sheet-b{padding:4px 16px 20px;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{width:560px;border-radius:12px;max-height:90%}.sheet.wide{width:860px}}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btns.start{justify-content:flex-start}

/* document editor */
.items-h{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px}
.items-h h3{font-size:20px}
.lineitem{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.lineitem .nums{display:grid;grid-template-columns:.8fr .8fr 1.6fr;gap:8px;margin-top:8px}
.lineitem .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.lineitem .foot b{font-variant-numeric:tabular-nums}
.totals{margin:10px 0 14px;border-top:2px solid var(--ink);padding-top:8px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .grand{font-family:var(--f-head);font-size:26px;font-weight:700;margin-top:4px}

/* preview / print */
#preview{position:fixed;inset:0;background:#6b7280;z-index:60;overflow:auto}
#preview[hidden]{display:none}
.pv-bar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--side);color:#fff;flex-wrap:wrap}
.pv-bar .btn{min-height:38px}
.sheetdoc{background:#fff;color:#1B2333;width:min(794px,100%);margin:16px auto;padding:0 0 28px;font-size:13.5px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.sheetdoc .tape{border-radius:0;height:14px;background:
  repeating-linear-gradient(90deg,#1B2333 0 1.5px,transparent 1.5px 40px) left bottom/100% 14px no-repeat,
  repeating-linear-gradient(90deg,#1B2333 0 1px,transparent 1px 8px) left bottom/100% 7px no-repeat,#F2B01E}
.sd-in{padding:22px 28px 0}
.sd-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sd-co{display:flex;gap:12px;align-items:flex-start}
.sd-co img{max-height:58px;max-width:120px;object-fit:contain}
.sd-co h2{font-size:24px}
.sd-co p{margin:2px 0 0;color:#4a5262;font-size:12.5px;white-space:pre-line}
.sd-title{text-align:right}
.sd-title h1{font-size:40px;letter-spacing:1px}
.sd-title div{font-size:13px;margin-top:2px}
.sd-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 14px;padding:12px 0;border-top:1px solid #d5d9d1;border-bottom:1px solid #d5d9d1}
.sd-meta small{display:block;color:#5E6676;font-size:12px}
.sd-meta p{margin:2px 0;white-space:pre-line}
.sheetdoc table{width:100%;border-collapse:collapse;margin-top:6px}
.sheetdoc th{background:#1B2333;color:#fff;text-align:left;padding:7px 8px;font-size:12.5px;font-weight:600}
.sheetdoc td{padding:7px 8px;border-bottom:1px solid #e1e4dd;vertical-align:top}
.sheetdoc .r{text-align:right;font-variant-numeric:tabular-nums}.sheetdoc .c{text-align:center;width:30px}
.sd-tot{margin:12px 0 0 auto;width:min(320px,100%)}
.sd-tot div{display:flex;justify-content:space-between;padding:3px 8px}
.sd-tot .g{background:#F2B01E;font-weight:700;font-size:15.5px;padding:8px;margin-top:4px}
.sd-say{margin:12px 0;font-style:italic;color:#4a5262}
.sd-foot{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:18px}
.sd-foot h4{margin:0 0 4px;font-size:12.5px;color:#5E6676}
.sd-foot p{margin:0;white-space:pre-line}
.sd-sign{text-align:center}.sd-sign .sp{height:70px}
.sd-sign b{border-top:1px solid #1B2333;display:inline-block;padding-top:3px;min-width:150px}
@media print{
  :root{padding:0!important}
  body>*:not(#preview){display:none!important}
  body{background:#fff}
  #preview{position:static!important;background:#fff;overflow:visible}
  .pv-bar{display:none!important}
  .sheetdoc{box-shadow:none;margin:0;width:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (min-width:860px){#toast{bottom:28px}}
.scrollx{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;min-width:150px}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
.tbl tfoot td{font-weight:700;background:var(--soft)}
label.btn:focus-within{outline:2px solid var(--info);outline-offset:2px}
.logo-prev{max-height:60px;max-width:160px;display:block;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
.welcome{padding:26px 20px;display:grid;gap:12px}
.welcome h2{font-size:30px}
.welcome p{margin:0;color:var(--muted);max-width:56ch}
</style>
</head>
<body>
<div id="app">
  <aside class="side" aria-label="Menu utama">
    <a class="brand" href="#beranda"><i></i>RH System</a>
    <nav id="sidenav"></nav>
    <div class="grow"></div>
    <nav><a class="nl" data-nav="pengaturan" href="#pengaturan"></a></nav>
  </aside>
  <div class="mtop"><a class="brand" href="#beranda"><i></i>Mandor</a><a class="icon-btn" href="#pengaturan" aria-label="Pengaturan" id="mset"></a></div>
  <main class="main"><div id="view"></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav>
</div>
<div id="modalRoot"></div>
<div id="preview" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)));
const fmtQty=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
const sumBy=(a,f)=>a.reduce((x,i)=>x+(+f(i)||0),0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>iso(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const MS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ML=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fmtD=s=>{if(!s)return '-';const [y,m,d]=s.split('-').map(Number);return d+' '+MS[m-1]+' '+y};
const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);return ML[m-1]+' '+y};
const short=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(1)+' M':a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+' jt':a>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n))};

function terbilang(n){
  n=Math.floor(Math.abs(n));
  const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  const t=n=>{
    if(n<12)return s[n];
    if(n<20)return t(n-10)+' belas';
    if(n<100)return t(Math.floor(n/10))+' puluh'+(n%10?' '+t(n%10):'');
    if(n<200)return 'seratus'+(n%100?' '+t(n%100):'');
    if(n<1000)return t(Math.floor(n/100))+' ratus'+(n%100?' '+t(n%100):'');
    if(n<2000)return 'seribu'+(n%1000?' '+t(n%1000):'');
    if(n<1e6)return t(Math.floor(n/1000))+' ribu'+(n%1000?' '+t(n%1000):'');
    if(n<1e9)return t(Math.floor(n/1e6))+' juta'+(n%1e6?' '+t(n%1e6):'');
    if(n<1e12)return t(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+t(n%1e9):'');
    return t(Math.floor(n/1e12))+' triliun'+(n%1e12?' '+t(n%1e12):'');
  };
  const r=n===0?'nol':t(n);return r.charAt(0).toUpperCase()+r.slice(1)+' rupiah';
}

const IC={
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  tasks:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',
  wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l2-3h12M16 14h2"/>',
  file:'<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6"/>',

const VT=['Supplier material','Subkontraktor','Tukang / mandor','Sewa alat','Jasa lainnya'];
const vName=id=>(S.vendors.find(v=>v.id===id)||{}).name||'';
const billPaid=b=>sumBy(b.payments||[],p=>p.amount);
const billBal=b=>Math.max(0,(+b.amount||0)-billPaid(b));
function billState(b){if(billBal(b)<=0.5)return 'Lunas';if(b.due&&b.due<todayStr())return 'Jatuh tempo';return billPaid(b)>0?'Sebagian':'Belum dibayar'}
const budgetTotal=p=>{const r=sumBy(Object.values(p.rab||{}),x=>x);return r>0?r:(+p.budget||0)};
function realisasi(p){const m={};S.tx.filter(t=>t.projectId===p.id&&t.type==='out').forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);S.bills.filter(b=>b.projectId===p.id).forEach(b=>{const x=billBal(b);if(x>0)m[b.category]=(m[b.category]||0)+x});return m}
function vendorByName(n,create){n=(n||'').trim();if(!n)return null;let v=S.vendors.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!v&&create){v={id:uid(),name:n,type:'Supplier material',contact:'',phone:'',address:'',bank:'',notes:''};S.vendors.push(v)}return v||null}
function syncBillTx(b,pay){S.tx=S.tx.filter(t=>t.paymentId!==pay.id);S.tx.push({id:uid(),type:'out',date:pay.date,amount:pay.amount,category:b.category,desc:`Bayar ${vName(b.vendorId)}: ${b.desc}`,projectId:b.projectId,vendorId:b.vendorId,billId:b.id,paymentId:pay.id})}
const csvCell=v=>{v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
async function saveCsv(name,rows){
  const data='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  try{const dl=window.claude&&await window.claude.use('downloads');if(!dl)throw 0;await dl.save({filename:name,data});toast('File disimpan');return}
  catch(e){if(e&&e.code==='declined')return}
  modal('Salin data CSV',`<p class="muted" style="margin-top:0">Unduh otomatis tidak tersedia di sini. Salin teks ini lalu tempel ke Excel atau Google Sheets.</p><textarea id="csvta" rows="8" readonly>${esc(data)}</textarea><div class="btns"><button class="btn primary" data-act="copy-text" data-src="csvta">Salin</button></div>`);
}

/* ============ perhitungan ============ */
function docTotals(d){
  const sub=sumBy(d.items||[],i=>(+i.qty||0)*(+i.price||0));
  const disc=Math.min(+d.discount||0,sub),base=sub-disc;
  const tax=d.ppn?base*(+d.ppnRate||0)/100:0;
  return{sub,disc,base,tax,total:base+tax};
}
const paid=v=>sumBy(v.payments||[],p=>p.amount);
const balance=v=>Math.max(0,docTotals(v).total-paid(v));
function invState(v){
  const t=docTotals(v).total,p=paid(v);
  if(t>0&&p>=t-0.5)return 'Lunas';
  if(v.status==='draft'&&p===0)return 'Draft';
  if(v.dueDate&&v.dueDate<todayStr())return 'Jatuh tempo';
  return p>0?'Sebagian':'Terkirim';
}
function pStats(p){
  const inc=sumBy(S.tx.filter(t=>t.projectId===p.id&&t.type==='in'),t=>t.amount);
  const exp=sumBy(S.tx.filter(t=>t.projectId===p.id&&t.type==='out'),t=>t.amount);
  const tk=S.tasks.filter(t=>t.projectId===p.id),dn=tk.filter(t=>t.status==='done').length;
  return{inc,exp,profit:inc-exp,tasks:tk.length,done:dn,pct:tk.length?Math.round(dn/tk.length*100):0};
}
function takeNo(kind){
  const s=S.settings,y=new Date().getFullYear(),k=kind+y;
  return {key:k,peek:()=>`${kind==='quote'?s.quotePrefix:s.invoicePrefix}/${y}/${String((S.cnt[k]||0)+1).padStart(3,'0')}`};
}
function nextNo(kind){const t=takeNo(kind);const n=t.peek();S.cnt[t.key]=(S.cnt[t.key]||0)+1;return n}

  <div class="cols three">${col('todo')}${col('doing')}${col('done')}</div>`;

function taskCard(x){
  const late=x.status!=='done'&&x.due&&x.due<todayStr();
  const b=[];
  if(x.status==='todo')b.push(`<button class="btn sm primary" data-act="task-status" data-id="${x.id}" data-s="doing">Mulai</button>`);
  if(x.status==='doing')b.push(`<button class="btn sm primary" data-act="task-status" data-id="${x.id}" data-s="done">Selesai</button>`);
  if(x.status==='done')b.push(`<button class="btn sm" data-act="task-status" data-id="${x.id}" data-s="todo">Buka lagi</button>`);
  b.push(`<button class="btn sm" data-act="edit-task" data-id="${x.id}">Ubah</button>`);
  return `<div class="task"><div class="t">${esc(x.title)}</div><div class="s">${x.projectId?esc(projName(x.projectId))+' · ':''}${x.assignee?esc(x.assignee)+' · ':''}<span class="${late?'late':''}">${x.due?(late?'Terlambat – ':'')+fmtD(x.due):'Tanpa tenggat'}</span> · ${PR[x.priority||'mid'][0]}</div><div class="bt">${b.join('')}</div></div>`;

function viewKeuangan(){

function finTx(){

  const l=S.tx.filter(x=>(ui.finMonth==='all'||x.date.startsWith(ui.finMonth))&&(ui.finType==='all'||x.type===ui.finType)&&(ui.finProj==='all'||x.projectId===ui.finProj)).sort((a,b)=>b.date.localeCompare(a.date));

function billRow(b){

function finBills(){

function finVendors(){

  return `<div class="panel"><div class="list">${l.length?l.map(v=>{const spent=sumBy(S.tx.filter(t=>t.vendorId===v.id&&t.type==='out'),t=>t.amount),hut=sumBy(S.bills.filter(b=>b.vendorId===v.id),billBal);return `<button class="item" data-act="vendor-open" data-id="${v.id}"><div class="main2"><div class="t">${esc(v.name)}</div><div class="s">${esc(v.type)}${v.phone?' · '+esc(v.phone):''}</div></div><div class="amt num">${rp(spent)}${hut>0?`<div class="s neg">hutang ${rp(hut)}</div>`:''}</div></button>`}).join(''):'<div class="empty"><b>Belum ada vendor</b>Tambahkan supplier, subkontraktor, atau tukang langganan. Vendor juga otomatis tersimpan saat kamu mengetik namanya di tagihan atau transaksi.</div>'}</div></div>`;
}
function projReport(){
  return S.projects.map(p=>{const st=pStats(p);return{p,st,bt:budgetTotal(p),piu:sumBy(S.invoices.filter(v=>v.projectId===p.id&&invState(v)!=='Draft'),balance),hut:sumBy(S.bills.filter(b=>b.projectId===p.id),billBal)}});
}
function finReport(){
  const rows=projReport();
  const T={v:sumBy(rows,r=>r.p.value),inc:sumBy(rows,r=>r.st.inc),exp:sumBy(rows,r=>r.st.exp),piu:sumBy(rows,r=>r.piu),hut:sumBy(rows,r=>r.hut)};
  const over=sumBy(S.tx.filter(t=>t.type==='out'&&!t.projectId),t=>t.amount);
  const now=new Date(),ms=[];
  for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=iso(d).slice(0,7);ms.push({k,i:sumBy(S.tx.filter(x=>x.type==='in'&&x.date.startsWith(k)),x=>x.amount),o:sumBy(S.tx.filter(x=>x.type==='out'&&x.date.startsWith(k)),x=>x.amount)})}
  const mg=(inc,pr)=>inc>0?Math.round(pr/inc*100)+'%':'-';
  const cell=(n,cls='')=>`<td class="num ${cls}">${rp(n)}</td>`;
  return `<div class="panel"><div class="ph"><h2>Laba rugi per proyek</h2></div><div class="scrollx"><table class="tbl"><thead><tr><th>Proyek</th><th>Kontrak</th><th>Diterima</th><th>Biaya</th><th>Laba kas</th><th>Margin</th><th>Piutang</th><th>Hutang</th></tr></thead><tbody>
    ${rows.length?rows.map(r=>`<tr><td>${esc(r.p.name)}</td>${cell(r.p.value)}${cell(r.st.inc,'pos')}${cell(r.st.exp)}${cell(r.st.profit,r.st.profit<0?'neg':'')}<td class="num">${mg(r.st.inc,r.st.profit)}</td>${cell(r.piu)}${cell(r.hut)}</tr>`).join(''):'<tr><td colspan="8" class="muted">Belum ada proyek.</td></tr>'}
    </tbody>${rows.length?`<tfoot><tr><td>Total</td>${cell(T.v)}${cell(T.inc)}${cell(T.exp)}${cell(T.inc-T.exp)}<td class="num">${mg(T.inc,T.inc-T.exp)}</td>${cell(T.piu)}${cell(T.hut)}</tr></tfoot>`:''}</table></div>
    <p class="muted" style="font-size:13.5px;margin:0;padding:10px 16px 14px">Laba kas = uang diterima dikurangi uang keluar. ${over>0?`Belum termasuk pengeluaran tanpa proyek (${rp(over)}), misalnya operasional kantor.`:''}</p></div>
  <div class="panel section"><div class="ph"><h2>Arus kas 12 bulan</h2></div><div class="scrollx"><table class="tbl"><thead><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th><th>Selisih</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${monthLabel(m.k)}</td>${cell(m.i,'pos')}${cell(m.o)}${cell(m.i-m.o,m.i-m.o<0?'neg':'')}</tr>`).join('')}</tbody></table></div></div>`;
}

const NAV=[['beranda','Beranda','home'],['proyek','Proyek','folder'],['tugas','Tugas','tasks'],['keuangan','Keuangan','wallet'],['dokumen','Dokumen','file']];
function buildNav(){
  $('#sidenav').innerHTML=NAV.map(n=>`<a class="nl" data-nav="${n[0]}" href="#${n[0]}">${ic(n[2])}${n[1]}</a>`).join('');
  $('#tabbar').innerHTML=NAV.map(n=>`<a data-nav="${n[0]}" href="#${n[0]}">${ic(n[2],22)}<span>${n[1]}</span></a>`).join('');
  $('.side [data-nav="pengaturan"]').innerHTML=ic('gear')+'Pengaturan';
  $('#mset').innerHTML=ic('gear',22);

function render(){
  const [name,arg]=(location.hash||'#beranda').slice(1).split('/');
  let h;
  switch(name){
    case 'proyek':h=arg?viewProyekDetail(arg):viewProyek();break;
    case 'tugas':h=viewTugas();break;
    case 'keuangan':h=viewKeuangan();break;
    case 'dokumen':h=viewDokumen();break;
    case 'pengaturan':h=viewPengaturan();break;
    default:h=viewBeranda();

  $('#view').innerHTML=h;

window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

function openDocDetail(kind,id){
  const d=getDoc(kind,id);if(!d){closeModal();return}
  const T=docTotals(d),isQ=kind==='quote',p=S.projects.find(x=>x.id===d.projectId);
  const st=isQ?chip(QS[d.status][0],QS[d.status][1]):chip(invState(d),IS[invState(d)]);
  const a=(act,label,cls='',x='')=>`<button class="btn ${cls}" data-act="${act}" data-kind="${kind}" data-id="${id}" ${x}>${label}</button>`;
  let body=`<div style="margin-bottom:10px">${st}</div><dl class="kv">

    <dt>Total</dt><dd class="num"><b>${rp(T.total)}</b></dd>${isQ?'':`<dt>Sudah dibayar</dt><dd class="num pos">${rp(paid(d))}</dd><dt>Sisa tagihan</dt><dd class="num ${balance(d)>0?'neg':''}"><b>${rp(balance(d))}</b></dd>`}</dl>`;

  body+=`<div class="btns start" style="margin-top:18px">`+a('doc-preview',ic('print',18)+'Lihat &amp; cetak','primary')+a('doc-wa',ic('send',18)+'WhatsApp');

function buildPdf(kind,d){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const s=S.settings,T=docTotals(d),isQ=kind==='quote',pd=paid(d),W=210,M=15,R=W-M;
  const txt=(t,x,y,o)=>doc.text(String(t),x,y,o);
  const fs=n=>doc.setFontSize(n),bold=()=>doc.setFont('helvetica','bold'),norm=()=>doc.setFont('helvetica','normal'),ital=()=>doc.setFont('helvetica','italic');
  const gray=()=>doc.setTextColor(94,102,118),ink=()=>doc.setTextColor(27,35,51);
  doc.setFillColor(242,176,30);doc.rect(0,0,W,5,'F');
  let y=15,x=M;
  if(s.logo){try{const pr=doc.getImageProperties(s.logo),r=pr.width/pr.height;let h=16,w=h*r;if(w>36){w=36;h=w/r}doc.addImage(s.logo,'PNG',M,y-3,w,h);x=M+w+4}catch(e){}}
  ink();bold();fs(15);txt(s.company,x,y+3);
  norm();fs(9);gray();
  const co=[s.address,[s.phone,s.email].filter(Boolean).join(' · '),s.npwp?'NPWP '+s.npwp:''].filter(Boolean).join('\n');
  const cl=doc.splitTextToSize(co,100-(x-M));txt(cl,x,y+8);
  const leftEnd=y+8+cl.length*4;
  ink();bold();fs(22);txt(isQ?'PENAWARAN':'INVOICE',R,y+4,{align:'right'});
  fs(10);txt(d.number,R,y+11,{align:'right'});
  norm();fs(9);gray();
  txt('Tanggal: '+fmtD(d.date),R,y+16,{align:'right'});
  txt((isQ?'Berlaku s.d.: '+fmtD(d.validUntil):'Jatuh tempo: '+fmtD(d.dueDate)),R,y+20.5,{align:'right'});
  y=Math.max(leftEnd,y+24)+4;
  doc.setDrawColor(213,217,209);doc.setLineWidth(.3);doc.line(M,y,R,y);y+=6;
  gray();fs(8.5);txt(isQ?'Kepada':'Ditagihkan kepada',M,y);txt('Perihal',112,y);
  ink();bold();fs(10.5);txt(d.client||'-',M,y+5);
  const pt=doc.splitTextToSize(d.title||'-',R-112);txt(pt,112,y+5);
  norm();fs(9);gray();
  const ad=doc.splitTextToSize([d.clientAddress,d.clientPhone].filter(Boolean).join('\n')||' ',90);txt(ad,M,y+10);
  let my=y+10+ad.length*4;
  if(d.projectId){txt('Proyek: '+projName(d.projectId),112,y+5+pt.length*4.8)}
  y=Math.max(my,y+5+pt.length*4.8+5)+3;
  doc.line(M,y,R,y);y+=4;
  // tabel
  const cx={no:M,desc:M+11,qty:M+104,unit:M+107,price:M+138,tot:R};
  const head=()=>{doc.setFillColor(27,35,51);doc.rect(M,y,R-M,7,'F');doc.setTextColor(255,255,255);bold();fs(8.5);
    txt('No',M+2,y+4.8);txt('Uraian',cx.desc,y+4.8);txt('Jml',cx.qty,y+4.8,{align:'right'});txt('Sat',cx.unit,y+4.8);txt('Harga satuan',cx.price,y+4.8,{align:'right'});txt('Jumlah',cx.tot-1.5,y+4.8,{align:'right'});y+=7;norm();fs(9);ink()};
  head();
  d.items.forEach((it,i)=>{
    const dl=doc.splitTextToSize(it.desc,90),h=dl.length*4.1+3.4;
    if(y+h>278){doc.addPage();y=15;head()}
    ink();norm();fs(9);
    txt(i+1,M+5.5,y+4.6,{align:'center'});txt(dl,cx.desc,y+4.6);
    txt(fmtQty(it.qty),cx.qty,y+4.6,{align:'right'});txt(it.unit||'',cx.unit,y+4.6);
    txt(rp(it.price),cx.price,y+4.6,{align:'right'});txt(rp((+it.qty||0)*(+it.price||0)),cx.tot-1.5,y+4.6,{align:'right'});
    y+=h;doc.setDrawColor(225,228,221);doc.line(M,y,R,y);
  });
  y+=6;
  // total
  const rows=[['Subtotal',rp(T.sub)]];
  if(T.disc)rows.push(['Diskon','-'+rp(T.disc)]);
  if(T.tax)rows.push(['PPN '+d.ppnRate+'%',rp(T.tax)]);
  if(y+rows.length*5+30>280){doc.addPage();y=15}
  ink();norm();fs(9.5);
  rows.forEach(r=>{txt(r[0],128,y);txt(r[1],R-1.5,y,{align:'right'});y+=5});
  doc.setFillColor(242,176,30);doc.rect(124,y-3.5,R-124,8,'F');bold();fs(11);ink();
  txt('Total',128,y+1.8);txt(rp(T.total),R-1.5,y+1.8,{align:'right'});y+=9;
  if(!isQ&&pd>0){norm();fs(9.5);txt('Sudah dibayar',128,y);txt('-'+rp(pd),R-1.5,y,{align:'right'});y+=5;bold();txt('Sisa tagihan',128,y);txt(rp(balance(d)),R-1.5,y,{align:'right'});y+=5}
  y+=3;ital();fs(9);gray();
  const tb=doc.splitTextToSize('Terbilang: '+terbilang(!isQ&&pd>0?balance(d):T.total),R-M);txt(tb,M,y);y+=tb.length*4.2+6;
  // catatan, rekening, tanda tangan
  const nl=d.notes?doc.splitTextToSize(d.notes,105):[],bl=(!isQ&&s.bank)?doc.splitTextToSize(s.bank,105):[];
  const need=Math.max(40,(nl.length+bl.length)*4.2+16);
  if(y+need>285){doc.addPage();y=15}
  let ly=y;
  if(nl.length){gray();bold();fs(8.5);txt(isQ?'Syarat & ketentuan':'Catatan',M,ly);norm();fs(9);ink();txt(nl,M,ly+4.5);ly+=nl.length*4.2+8}
  if(bl.length){gray();bold();fs(8.5);txt('Pembayaran ke',M,ly);norm();fs(9);ink();txt(bl,M,ly+4.5)}
  norm();fs(9);ink();txt('Hormat kami,',160,y,{align:'center'});
  doc.setDrawColor(27,35,51);doc.line(138,y+26,182,y+26);bold();txt(s.owner||s.company,160,y+30,{align:'center'});
  return doc.output('blob');
}

function waInfo(kind,d){
  const s=S.settings,T=docTotals(d);let m;
  if(kind==='quote')m=`Yth. ${d.client},\n\nBerikut penawaran ${d.number}${d.title?' untuk '+d.title:''} senilai ${rp(T.total)}. Berlaku sampai ${fmtD(d.validUntil)}.\n\nTerima kasih,\n${s.company}`;
  else m=`Yth. ${d.client},\n\nBerikut tagihan ${d.number}${d.title?' untuk '+d.title:''}.\nSisa tagihan: ${rp(balance(d))}\nJatuh tempo: ${fmtD(d.dueDate)}\n${s.bank?'\nPembayaran ke:\n'+s.bank+'\n':''}\nTerima kasih,\n${s.company}`;
  let ph=(d.clientPhone||'').replace(/[^\d]/g,'');if(ph.startsWith('0'))ph='62'+ph.slice(1);
  return {text:m,url:`https://wa.me/${ph}?text=${encodeURIComponent(m)}`,hasPhone:!!ph};
}
function syncPayTx(inv,pay){
  S.tx=S.tx.filter(t=>t.paymentId!==pay.id);

}

document.addEventListener('change',e=>{
  const t=e.target;
  if('catpick' in t.dataset&&ED){const c=S.catalog.find(x=>x.id===t.value);if(c){const it={desc:c.name,qty:1,unit:c.unit||'ls',price:c.price},blank=ED.items.length===1&&!ED.items[0].desc&&!ED.items[0].price;if(blank)ED.items=[it];else ED.items.push(it);renderItems();refreshTotals()}t.value='';return}
  if(t.dataset.flt){ui[t.dataset.flt]=t.value;render();return}
  const form=t.form;
  if(form&&form.dataset.form==='tx'&&t.name==='type'){form.category.innerHTML=catOpts(t.value)}
  if(form&&form.id==='docform'){
    if(t.name==='projectId'){const p=S.projects.find(x=>x.id===t.value);if(p){if(!form.client.value)form.client.value=p.client||'';if(!form.clientAddress.value)form.clientAddress.value=p.address||'';if(!form.clientPhone.value)form.clientPhone.value=p.phone||'';if(!form.title.value)form.title.value=p.name}}
    if(t.name==='ppn')refreshTotals();
    if(t.name==='client'){const c=findClient(t.value);if(c){if(!form.clientPhone.value)form.clientPhone.value=c.phone;if(!form.clientAddress.value)form.clientAddress.value=c.address}}
  }
  if(t.id==='importFile'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.projects))throw 0;confirmBox('Data saat ini akan diganti dengan isi file cadangan.',()=>{const d=defaults();S=Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});save();render();toast('Data dipulihkan')},'Pulihkan')}catch(x){toast('File cadangan tidak valid')}};r.readAsText(t.files[0]);t.value='';
  }
  if(t.id==='logoFile'&&t.files[0]){
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.settings.logo=c.toDataURL('image/png');save();render();toast('Logo disimpan')};im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=r.result};r.readAsDataURL(t.files[0]);t.value='';
  }
});
document.addEventListener('input',e=>{
  const t=e.target,row=t.closest&&t.closest('.lineitem');
  if(row&&t.dataset.f&&ED){const it=ED.items[+row.dataset.i];it[t.dataset.f]=(t.dataset.f==='desc'||t.dataset.f==='unit')?t.value:t.value===''?'':+t.value;row.querySelector('.lt').textContent=rp((+it.qty||0)*(+it.price||0));refreshTotals();return}
  if(t.form&&t.form.id==='docform'&&(t.name==='discount'||t.name==='ppnRate'))refreshTotals();
  if(t.form&&t.form.dataset.form==='rab'){const tot=COUT.reduce((a,c,i)=>a+(+t.form['c'+i].value||0),0);$('#rabt').textContent=rp(tot)}
});

/* submit handlers */
const SUB={
  vendor:(f,d)=>{
    const o={name:d.name.trim(),type:d.type,contact:d.contact.trim(),phone:d.phone.trim(),address:d.address.trim(),bank:d.bank.trim(),notes:d.notes};
    if(f.dataset.id)Object.assign(S.vendors.find(v=>v.id===f.dataset.id),o);else{o.id=uid();S.vendors.push(o)}
    save();closeModal();render();toast('Vendor disimpan');
  },
  bill:(f,d)=>{
    const v=vendorByName(d.vendorName,true);
    const o={vendorId:v.id,date:d.date,due:d.due,desc:d.desc.trim(),ref:d.ref.trim(),category:d.category,amount:+d.amount||0,projectId:d.projectId};
    if(f.dataset.id){const b=S.bills.find(x=>x.id===f.dataset.id);Object.assign(b,o);S.tx.forEach(t=>{if(t.billId===b.id){t.projectId=b.projectId;t.vendorId=b.vendorId;t.category=b.category}})}
    else{const b={id:uid(),payments:[],...o};S.bills.push(b);if(d.paidNow){const pay={id:uid(),date:d.date,amount:b.amount,method:'Transfer',note:'Lunas'};b.payments.push(pay);syncBillTx(b,pay)}}
    ui.finTab='bills';save();closeModal();render();toast('Tagihan vendor disimpan');
  },
  billpay:(f,d)=>{
    const b=S.bills.find(x=>x.id===f.dataset.id),pay={id:uid(),date:d.date,amount:+d.amount||0,method:d.method,note:d.note.trim()};
    b.payments=b.payments||[];b.payments.push(pay);syncBillTx(b,pay);save();render();openBill(b.id);toast('Pembayaran dicatat');
  },
  rab:(f,d)=>{
    const p=S.projects.find(x=>x.id===f.dataset.id);p.rab={};COUT.forEach((c,i)=>{const v=+d['c'+i];if(v>0)p.rab[c]=v});p.budget=0;
    save();closeModal();render();toast('Anggaran disimpan');
  },
  cat:(f,d)=>{
    const o={name:d.name.trim(),unit:d.unit.trim()||'ls',price:+d.price||0};
    if(f.dataset.id)Object.assign(S.catalog.find(c=>c.id===f.dataset.id),o);else{o.id=uid();S.catalog.push(o)}
    save();closeModal();render();toast('Katalog disimpan');
  },
  project:(f,d)=>{
    const o={name:d.name.trim(),client:d.client.trim(),phone:d.phone.trim(),address:d.address.trim(),value:+d.value||0,start:d.start,end:d.end,status:d.status,notes:d.notes};
    if(f.dataset.id)Object.assign(S.projects.find(p=>p.id===f.dataset.id),o);else{o.id=uid();S.projects.push(o);}
    save();closeModal();render();toast('Proyek disimpan');
  },
  task:(f,d)=>{
    const o={title:d.title.trim(),projectId:d.projectId,assignee:d.assignee.trim(),due:d.due,priority:d.priority,status:d.status,notes:d.notes};
    if(f.dataset.id)Object.assign(S.tasks.find(x=>x.id===f.dataset.id),o);else{o.id=uid();S.tasks.push(o)}
    save();closeModal();render();toast('Tugas disimpan');
  },
  tx:(f,d)=>{
    const vv=d.type==='out'?vendorByName(d.vendorName,true):null;
    const o={type:d.type,date:d.date,amount:+d.amount||0,category:d.category,desc:d.desc.trim(),projectId:d.projectId,vendorId:vv?vv.id:''};
    if(f.dataset.id)Object.assign(S.tx.find(x=>x.id===f.dataset.id),o);else{o.id=uid();S.tx.push(o)}
    save();closeModal();render();toast(o.type==='in'?'Uang masuk dicatat':'Pengeluaran dicatat');
  },
  settings:(f,d)=>{
    Object.assign(S.settings,{company:d.company.trim(),owner:d.owner,phone:d.phone,email:d.email,npwp:d.npwp,address:d.address,bank:d.bank,quotePrefix:d.quotePrefix||'QT',invoicePrefix:d.invoicePrefix||'INV',ppnRate:+d.ppnRate||0,validDays:+d.validDays||14,dueDays:+d.dueDays||0,ppnDefault:!!d.ppnDefault,quoteTerms:d.quoteTerms,invoiceTerms:d.invoiceTerms});
    save();render();toast('Pengaturan disimpan');
  },
  doc:(f,d)=>{
    const items=ED.items.filter(i=>(i.desc||'').trim()).map(i=>({desc:i.desc.trim(),qty:+i.qty||0,unit:i.unit||'',price:+i.price||0}));
    if(!items.length){toast('Isi minimal satu uraian pekerjaan');return}
    const k=ED.kind,isQ=k==='quote',doc=ED.doc;
    Object.assign(doc,{number:d.number.trim(),date:d.date,projectId:d.projectId,client:d.client.trim(),clientPhone:d.clientPhone,clientAddress:d.clientAddress,title:d.title.trim(),items,discount:+d.discount||0,ppn:!!d.ppn,ppnRate:+d.ppnRate||0,notes:d.notes});
    if(isQ){doc.validUntil=d.validUntil;doc.status=d.status}else doc.dueDate=d.dueDate;
    const arr=isQ?S.quotes:S.invoices;
    if(ED.isNew){const t=takeNo(k);S.cnt[t.key]=(S.cnt[t.key]||0)+1;arr.push(doc)}
    else{const i=arr.findIndex(x=>x.id===doc.id);arr[i]=doc;if(!isQ)S.tx.forEach(t=>{if(t.invoiceId===doc.id){t.projectId=doc.projectId;t.desc=t.desc.replace(/^Pembayaran \S+/,'Pembayaran '+doc.number)}})}
    save();ui.docTab=k;render();openDocDetail(k,doc.id);toast('Tersimpan');
  },
  q2i:(f,d)=>{
    const q=getDoc('quote',f.dataset.id),pct=Math.min(100,Math.max(1,+d.pct||100)),T=docTotals(q);
    const inv=newDoc('invoice',q.projectId);
    Object.assign(inv,{client:q.client,clientAddress:q.clientAddress,clientPhone:q.clientPhone,title:q.title,quoteId:q.id,ppn:q.ppn,ppnRate:q.ppnRate});
    if(pct>=100){inv.items=q.items.map(i=>({...i}));inv.discount=q.discount}
    else{inv.items=[{desc:`Pembayaran ${fmtQty(pct)}% dari penawaran ${q.number}${q.title?' – '+q.title:''}`,qty:1,unit:'ls',price:Math.round(T.base*pct/100)}];inv.discount=0}
    openDocEditor('invoice',inv,true);
  },
  pay:(f,d)=>{
    const inv=getDoc('invoice',f.dataset.id);
    const pay={id:uid(),date:d.date,amount:+d.amount||0,method:d.method,note:d.note.trim()};
    inv.payments=inv.payments||[];inv.payments.push(pay);if(inv.status==='draft')inv.status='sent';
    syncPayTx(inv,pay);save();render();openDocDetail('invoice',inv.id);toast('Pembayaran dicatat');
  }
};
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,h=SUB[f.dataset.form];
  if(h)h(f,Object.fromEntries(new FormData(f)));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#preview').hidden)A['pv-close']();else closeModal()}
});
