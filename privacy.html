    <h1>Kebijakan Privasi RHSystem</h1>
    <p>1. Data yang dikumpulkan hanya untuk keperluan operasional aplikasi RHSystem.</p>
    <p>2. Data tidak akan dibagikan ke pihak ketiga tanpa izin.</p>
    <p>3. Data disimpan dengan aman di sistem.</p>
    <p>4. Pengguna dapat meminta penghapusan data kapan saja.</p>
    <p><strong>RHSystem</strong></p>
